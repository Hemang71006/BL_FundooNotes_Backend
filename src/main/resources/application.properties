
spring.application.name=fundoo-notes-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fundoo_notes_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Email Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Password Recovery Configuration
app.mail.from=${MAIL_FROM}
app.password-reset.url=${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
app.password-reset.expiration-minutes=15

# Logging Configuration

# Root logging level
logging.level.root=INFO

# Application logging level
logging.level.com.fundoonotes=DEBUG

# Spring framework logging level
logging.level.org.springframework=WARN

# Hibernate logging level
logging.level.org.hibernate=WARN

# Display timestamps and log details
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Save application logs to a file
logging.file.name=logs/fundoo-notes.log

# Log file rotation
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# JMS Messaging Configuration

# User registration queue name
app.jms.queue.user-registration=user.registration.queue

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# RabbitMQ Exchange
app.rabbitmq.exchange=fundoo.notes.exchange

# RabbitMQ Queue
app.rabbitmq.queue=fundoo.notes.reminder.queue

# RabbitMQ Routing Key
app.rabbitmq.routing-key=reminder.requested

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=60000

# Enable Spring Batch job execution when requested by the application
spring.batch.job.enabled=false

# Initialize Spring Batch metadata tables in MySQL
spring.batch.jdbc.initialize-schema=always